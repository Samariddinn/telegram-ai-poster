<div class="min-h-screen bg-slate-950 text-slate-100">
  <header class="border-b border-slate-800 px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-6">
      <span class="font-semibold">Telegram AI Poster</span>
      <nav class="flex items-center gap-4 text-sm text-slate-400">
        <a routerLink="/" routerLinkActive="text-slate-100" [routerLinkActiveOptions]="{ exact: true }">
          Dashboard
        </a>
        <a routerLink="/credentials" routerLinkActive="text-slate-100">Credentials</a>
        <a routerLink="/destinations" routerLinkActive="text-slate-100">Destinations</a>
        <a routerLink="/workflows" routerLinkActive="text-slate-100">Workflows</a>
      </nav>
    </div>
    <div class="flex items-center gap-4 text-sm text-slate-400">
      @if (auth.currentUser(); as user) {
        <span>{{ user.username }}</span>
      }
      <button
        type="button"
        class="rounded-md border border-slate-700 px-3 py-1.5 hover:bg-slate-800"
        (click)="logout()"
      >
        Log out
      </button>
    </div>
  </header>

  <main class="p-6">
    <router-outlet />
  </main>
</div>
